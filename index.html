<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#101613">
<title>Arena Breakout Companion</title>

<link rel="stylesheet"
 href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>
:root{
  color-scheme:dark;
  --bg:#0b100e;
  --panel:#151e18;
  --border:#2b3b30;
  --green:#c2ee75;
  --muted:#a3b3a6;
}
*{box-sizing:border-box}
body{
  margin:0;
  background:var(--bg);
  color:#edf4ed;
  font:14px system-ui,sans-serif;
}
button,input,select{font:inherit}
button,select,input[type=text],.upload{
  border:1px solid var(--border);
  border-radius:9px;
  background:#202c24;
  color:#edf4ed;
  padding:10px 12px;
}
button,.upload{cursor:pointer}
button:hover,.upload:hover{border-color:var(--green)}
button:disabled{opacity:.45;cursor:default}
button.active{background:var(--green);color:#152014}
button:focus-visible,input:focus-visible,select:focus-visible{
  outline:2px solid var(--green);
  outline-offset:2px;
}
header{
  padding:18px 22px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  border-bottom:1px solid var(--border);
}
.brand{font-size:19px;font-weight:850}
.brand small{
  display:block;
  font-size:10px;
  color:var(--green);
  letter-spacing:3px;
  margin-top:5px;
}
main{
  max-width:1600px;
  margin:auto;
  padding:18px;
  display:grid;
  grid-template-columns:310px minmax(0,1fr);
  gap:16px;
}
.panel{
  border:1px solid var(--border);
  border-radius:14px;
  background:var(--panel);
  padding:16px;
  margin-bottom:14px;
}
h2{font-size:16px;margin:0 0 13px}
label.field{
  display:block;
  color:var(--muted);
  font-size:12px;
  margin:12px 0 7px;
}
select,input[type=text]{width:100%}
.tools{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:7px;
  margin-top:12px;
}
.tools button{font-size:12px}
.actions{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}
.help{font-size:12px;color:var(--muted);line-height:1.6}
.upload{display:block;text-align:center;margin-top:12px}
.upload input{position:absolute;opacity:0;width:1px;height:1px}
#categories{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:15px;
  max-height:340px;
  overflow:auto;
}
#categories label{font-size:12px;display:flex;gap:5px;align-items:start}
#categories input{margin:2px 0}
#status{font-size:12px;color:var(--green);line-height:1.6;margin:12px 0}
#results{max-height:250px;overflow:auto;display:grid;gap:7px;margin-top:12px}
#results button{text-align:left;font-size:12px}
.map-panel{min-width:0}
.map-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.map-head h2{margin:0}
#map{
  width:100%;
  height:calc(100dvh - 180px);
  min-height:480px;
  border:1px solid var(--border);
  border-radius:12px;
  background:#0b130e;
}
#summary{color:var(--muted);font-size:12px;line-height:1.6;margin-top:12px}
.legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:12px;font-size:12px;color:var(--muted)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}
.poi-icon{background:none;border:0}
.poi-icon span{
  display:grid;
  place-items:center;
  width:25px;height:25px;
  border:1px solid #fff;
  border-radius:7px;
  color:#101510;
  font-size:12px;
  font-weight:850;
  box-shadow:0 2px 7px #0009;
}
.own-icon span{border:2px solid white;border-radius:50%;width:29px;height:29px}
.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:#1b2920;color:#edf4ed}
.leaflet-popup-content{line-height:1.6;min-width:190px;max-width:280px}
.leaflet-popup-content h3{margin:0 0 7px;font-size:16px}
.leaflet-popup-content p{margin:7px 0;white-space:pre-line}
.leaflet-popup-content small{color:#b0c1b3}
.leaflet-popup-content button{margin-top:10px}
.leaflet-control-zoom a{
  background:#202c24!important;
  color:white!important;
  border-color:#3b4d40!important;
}
.leaflet-control-attribution{background:#142018dd!important;color:#b0c1b3!important}
.leaflet-control-attribution a{color:#c2ee75!important}
footer{padding:10px 20px 24px;text-align:center;font-size:12px;color:var(--muted)}
footer a{color:var(--green)}
@media(max-width:850px){
  main{grid-template-columns:1fr;padding:12px}
  .map-panel{grid-row:1}
  #map{height:62dvh;min-height:380px}
  header{padding:15px}
}
</style>
</head>
<body>

<header>
  <div class="brand">
    ARENA BREAKOUT
    <small>COMPANION / INTERACTIVE MAPS</small>
  </div>
  <button id="language">EN</button>
</header>

<main>
<aside>
  <section class="panel">
    <h2 data-text="planning"></h2>

    <label class="field" for="mapSelect" data-text="mapLabel"></label>
    <select id="mapSelect">
      <option value="farm">Farm</option>
      <option value="valley">Valley</option>
      <option value="armory">Armory</option>
      <option value="tv">TV Station</option>
      <option value="northridge">Northridge · eigenes Bild</option>
      <option value="custom">Eigene Karte</option>
    </select>

    <label class="field" for="markerName" data-text="name"></label>
    <input id="markerName" type="text" maxlength="80">

    <div class="tools">
      <button data-tool="inspect" data-text="inspect"></button>
      <button data-tool="player" data-text="player"></button>
      <button data-tool="note" data-text="note"></button>
      <button data-tool="loot" data-text="loot"></button>
      <button data-tool="exit" data-text="exit"></button>
      <button data-tool="route" data-text="route"></button>
    </div>

    <p class="help" data-text="instructions"></p>

    <div class="actions">
      <button id="undo" data-text="undo"></button>
      <button id="clearOwn" data-text="clearOwn"></button>
    </div>

    <label class="upload">
      <span data-text="upload"></span>
      <input id="upload" type="file"
       accept="image/png,image/jpeg,image/webp">
    </label>

    <div class="actions">
      <button id="original" data-text="original"></button>
    </div>

    <div id="status" role="status" aria-live="polite"></div>
  </section>

  <section class="panel">
    <h2 data-text="filters"></h2>
    <input id="search" type="text" maxlength="100">
    <div class="actions">
      <button id="showAll" data-text="showAll"></button>
      <button id="hideAll" data-text="hideAll"></button>
      <button id="refresh" data-text="refresh"></button>
    </div>
    <div id="categories"></div>
    <div id="results"></div>
  </section>
</aside>

<section class="panel map-panel">
  <div class="map-head">
    <h2 id="mapTitle">Farm</h2>
    <button id="fit" data-text="fit"></button>
  </div>

  <div id="map"></div>

  <div class="legend">
    <span><i class="dot" style="background:#69caff"></i><span data-text="exit"></span></span>
    <span><i class="dot" style="background:#ffd369"></i>Safes</span>
    <span><i class="dot" style="background:#d6a3ff"></i><span data-text="keys"></span></span>
    <span><i class="dot" style="background:#c2ee75"></i><span data-text="spawns"></span></span>
  </div>

  <div id="summary"></div>
  <p class="help" data-text="notice"></p>
</section>
</main>

<footer>
  <span data-text="footer"></span> ·
  <a href="https://github.com/nicolasaigner/ABI-InteractiveMaps"
     target="_blank" rel="noopener noreferrer">
    Karten & Daten: Nicolas Aigner / ABI-InteractiveMaps
  </a> ·
  <a href="https://github.com/nicolasaigner/ABI-InteractiveMaps/blob/main/LICENSE"
     target="_blank" rel="noopener noreferrer">MIT</a>
</footer>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
"use strict";

const $ = id => document.getElementById(id);
const ROOT =
  "https://raw.githubusercontent.com/nicolasaigner/ABI-InteractiveMaps/main/public/";

const configs = {
  farm:{name:"Farm",file:"farm"},
  valley:{name:"Valley",file:"valley"},
  armory:{name:"Armory",file:"armory"},
  tv:{name:"TV Station",file:"tv-station"},
  northridge:{name:"Northridge"},

};

const words = {

  notice:"Community locations, no live tracking. Extractions may have requirements and loot is not guaranteed. This source has no mission locations. Source details are shown in English.",

  saveFailed:"Saving failed. Changes last only until the page reloads.",
  libraryFailed:"Map library could not load. Please reload the page.",

  confirmClear:"Delete all personal markers on this map?",
  confirmImage:"Change the map image and delete personal markers on this map?",
  uploadFailed:"Image could not load. Please choose PNG, JPG or WebP under 15 MB.",
  source:"Community data; details may be outdated.",
  own:"Personal marker · set manually",
  visible:"visible community markers",
  personal:"personal markers",
  search:"Search: Safe, Motel, Key …",
  noResults:"No results.",

  custom:"Custom map"

};

const german = {
  "Player Spawn":"Spieler-Spawn",
  "Player spawn (Lockdown)":"Spieler-Spawn (Lockdown)",
  "Extraction Point":"Ausgänge",
  "Key Rooms":"Schlüsseltüren",
  "Safe":"Safes",
  "Air Drop":"Airdrops",
  "SCAV SNIPER":"Scav-Scharfschützen",
  "Scav Sniper":"Scav-Scharfschützen",
  "Military Supply Case":"Militärkisten",
  "Military Supply Crate":"Militärkisten",
  "Weapon Box":"Waffenkisten",
  "Weapons":"Waffen",
  "Document Case":"Dokumentenkoffer",
  "Filing Cabinet":"Aktenschränke",
  "Storage Case":"Lagerkisten",
  "Computer":"Computer",
  "Toolbox":"Werkzeugkisten",
  "Ammo Box":"Munitionskisten",
  "Grenade Box":"Granatenkisten",
  "Duffle Bag":"Sporttaschen",
  "Jacket":"Jacken",
  "Suitcase":"Koffer",
  "Medical":"Medizin",
  "Cash Register":"Kassen",
  "Extraction Lever":"Ausgangshebel",
  "Switch":"Schalter"
};

const STORAGE = "abi-companion-planner-v1";
const PREFS = "abi-interactive-preferences-v1";
const ownTypes = ["player","note","loot","exit","route"];

let lang = "de";
let selected = "farm";
let tool = "inspect";
let storedMaps = {};
let hidden = new Set();
let undoStacks = {};
let leafletMap, imageLayer, communityLayer, ownLayer;
let bounds, currentData = null, requestId = 0;
let statusKey = "loading";
let loading = false;
const dataCache = new Map();

try {
  const saved = JSON.parse(localStorage.getItem(STORAGE) || "null");
  if(saved && typeof saved === "object"){
    lang = saved.lang === "en" ? "en" : "de";
    for(const [id,s] of Object.entries(saved.maps || {})){
      if(!configs[id] || !s || typeof s !== "object") continue;

      const image =
        typeof s.image === "string" &&
        /^data:image\/(png|jpeg|webp);base64,/.test(s.image)
          ? s.image : "";

      storedMaps[id] = {
        image,
        ratio:Number.isFinite(s.ratio) && s.ratio > 0 ? s.ratio : 1,
        markers:Array.isArray(s.markers) ? s.markers.filter(m =>
          m && ownTypes.includes(m.type) &&
          typeof m.id === "string" &&
          Number.isFinite(m.x) && Number.isFinite(m.y) &&
          m.x >= 0 && m.x <= 100 && m.y >= 0 && m.y <= 100
        ).map(m => ({
          ...m,
          name:String(m.name || "").slice(0,80)
        })) : []
      };
    }
  }
} catch(e){}

try {
  const prefs = JSON.parse(localStorage.getItem(PREFS) || "{}");
  if(configs[prefs.selected]) selected = prefs.selected;
  if(Array.isArray(prefs.hidden)){
    hidden = new Set(prefs.hidden.filter(x => typeof x === "string"));
  }
} catch(e){}

function t(key){ return words[lang][key] || key; }

function categoryName(name){
  return lang === "de" ? german[name] || name : name;
}

function state(){
  if(!storedMaps[selected]){
    storedMaps[selected] = {image:"",ratio:1,markers:[]};
  }
  return storedMaps[selected];
}

function setStatus(key){
  statusKey = key;
  $("status").textContent = t(key);
}

function savePrefs(){
  try {
    localStorage.setItem(PREFS,JSON.stringify({
      selected,hidden:[...hidden]
    }));
  } catch(e){}
}

function save(){
  try {
    localStorage.setItem(STORAGE,JSON.stringify({
      lang,maps:storedMaps
    }));
    savePrefs();
    setStatus("saved");
  } catch(e){
    setStatus("saveFailed");
  }
}

function snapshot(){
  const stack = undoStacks[selected] ||= [];
  stack.push(state().markers.map(m => ({...m})));
  if(stack.length > 30) stack.shift();
}

function translate(){
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-text]").forEach(el => {
    el.textContent = t(el.dataset.text);
  });
  $("language").textContent = lang === "de" ? "EN" : "DE";
  $("search").placeholder = t("search");
  $("search").setAttribute("aria-label",t("search"));
  $("markerName").placeholder = lang === "de"
    ? "z. B. Treffpunkt" : "e.g. Meeting point";

  $("mapSelect").querySelector('[value="northridge"]').textContent =
    lang === "de" ? "Northridge · eigenes Bild" : "Northridge · custom image";

  $("mapSelect").querySelector('[value="custom"]').textContent = t("custom");

  $("mapTitle").textContent =
    selected === "custom" ? t("custom") : configs[selected].name;

  $("status").textContent = t(statusKey);

  document.querySelectorAll("[data-tool]").forEach(b => {
    const active = b.dataset.tool === tool;
    b.classList.toggle("active",active);
    b.setAttribute("aria-pressed",String(active));
  });

  $("original").hidden = !configs[selected].file || !state().image;
  $("refresh").disabled = loading;
  $("undo").disabled = !(undoStacks[selected]?.length);
  $("clearOwn").disabled = !state().markers.length;
}

function appearance(name){
  const n = name.toLowerCase();
  if(n.includes("extraction point")) return ["E","#69caff"];
  if(n.includes("safe")) return ["S","#ffd369"];
  if(n.includes("key")) return ["K","#d6a3ff"];
  if(n.includes("spawn")) return ["P","#c2ee75"];
  if(n.includes("scav") || n.includes("sniper")) return ["!","#ff8989"];
  if(n.includes("switch") || n.includes("lever")) return ["↔","#88e3e0"];
  if(n.includes("medical")) return ["+","#9be3b1"];
  if(n.includes("weapon")) return ["W","#edbf88"];
  if(n.includes("ammo")) return ["A","#edbf88"];
  if(n.includes("air drop")) return ["D","#f8b6de"];
  return ["L","#c5cbd0"];
}

function icon(symbol,color,personal=false){
  const span = document.createElement("span");
  span.textContent = symbol;
  span.style.background = color;

  return L.divIcon({
    html:span,
    className:"poi-icon" + (personal ? " own-icon" : ""),
    iconSize:personal ? [29,29] : [25,25],
    iconAnchor:personal ? [14.5,14.5] : [12.5,12.5],
    popupAnchor:[0,-14]
  });
}

function popup(title,description,category,personalId){
  const box = document.createElement("div");
  const heading = document.createElement("h3");
  heading.textContent = title;
  box.append(heading);

  if(category){
    const p = document.createElement("p");
    p.textContent = category;
    box.append(p);
  }

  if(description){
    const p = document.createElement("p");
    p.textContent = description;
    box.append(p);
  }

  const small = document.createElement("small");
  small.textContent = personalId ? t("own") : t("source");
  box.append(small);

  if(personalId){
    const button = document.createElement("button");
    button.textContent = t("delete");

    button.addEventListener("click",() => {
      snapshot();
      state().markers = state().markers.filter(m => m.id !== personalId);
      save();
      drawOwn();
    });

    box.append(document.createElement("br"),button);
  }

  return box;
}

function positionToLatLng(m){
  const sw = bounds.getSouthWest();
  const ne = bounds.getNorthEast();

  return [
    ne.lat - m.y / 100 * (ne.lat - sw.lat),
    sw.lng + m.x / 100 * (ne.lng - sw.lng)
  ];
}

function latLngToPosition(latlng){
  const sw = bounds.getSouthWest();
  const ne = bounds.getNorthEast();

  return {
    x:Math.max(0,Math.min(100,
      (latlng.lng - sw.lng)/(ne.lng-sw.lng)*100)),
    y:Math.max(0,Math.min(100,
      (ne.lat-latlng.lat)/(ne.lat-sw.lat)*100))
  };
}

function updateSummary(count){
  $("summary").textContent =
    count + " " + t("visible") + " · " +
    state().markers.length + " " + t("personal");
}

function buildFilters(){
  $("categories").replaceChildren();
  if(!currentData) return;

  const counts = new Map();
  currentData.markers.forEach(m => {
    const id = String(m.categoryId);
    counts.set(id,(counts.get(id)||0)+1);
  });

  currentData.categories.forEach(c => {
    const label = document.createElement("label");
    const checkbox = document.createElement("input");
    checkbox.type = "checkbox";
    checkbox.checked = !hidden.has(c.name);

    checkbox.addEventListener("change",() => {
      if(checkbox.checked) hidden.delete(c.name);
      else hidden.add(c.name);
      savePrefs();
      drawCommunity();
    });

    label.append(
      checkbox,
      document.createTextNode(
        categoryName(c.name) + " (" +
        (counts.get(String(c.id))||0) + ")"
      )
    );

    $("categories").append(label);
  });
}

function drawCommunity(){
  if(!communityLayer) return;
  communityLayer.clearLayers();
  $("results").replaceChildren();

  let count = 0;
  const query = $("search").value.trim().toLowerCase();
  const matches = [];

  if(currentData && !state().image && imageLayer){
    const cats = new Map(
      currentData.categories.map(c => [String(c.id),c])
    );

    currentData.markers.forEach(m => {
      const category = cats.get(String(m.categoryId));
      if(!category || hidden.has(category.name)) return;

      const title = String(m.popup?.title || category.name);
      const description = String(m.popup?.description || "");

      const searchable = [
        title,description,category.name,categoryName(category.name)
      ].join(" ").toLowerCase();

      if(query && !searchable.includes(query)) return;

      const latlng = L.latLng(m.position[1],m.position[0]);
      if(!bounds.contains(latlng)) return;

      const [symbol,color] = appearance(category.name);

      const marker = L.marker(latlng,{
        icon:icon(symbol,color),
        title:categoryName(category.name)+": "+title,
        bubblingMouseEvents:false
      }).bindPopup(
        popup(title,description,categoryName(category.name))
      ).addTo(communityLayer);

      count++;

      if(query) matches.push({title,category,marker});
    });
  }

  if(query){
    matches.slice(0,60).forEach(item => {
      const button = document.createElement("button");
      button.textContent =
        categoryName(item.category.name) + " · " + item.title;

      button.addEventListener("click",() => {
        leafletMap.setView(
          item.marker.getLatLng(),
          Math.max(leafletMap.getZoom(),-1)
        );
        item.marker.openPopup();
      });

      $("results").append(button);
    });

    if(!matches.length || matches.length>60){
      const p = document.createElement("p");
      p.className = "help";
      p.textContent = matches.length ? t("limited") : t("noResults");
      $("results").append(p);
    }
  }

  updateSummary(count);
}

function drawOwn(){
  if(!ownLayer) return;
  ownLayer.clearLayers();
  translate();

  if(!bounds || !imageLayer) return;

  const markers = state().markers;
  const route = markers.filter(m => m.type === "route");

  if(route.length>1){
    L.polyline(route.map(positionToLatLng),{
      color:"#c2ee75",
      weight:3,
      dashArray:"8 6",
      interactive:false
    }).addTo(ownLayer);
  }

  markers.forEach(m => {
    const symbols = {
      player:"P",note:"N",loot:"L",exit:"E",
      route:String(route.findIndex(r => r.id===m.id)+1)
    };

    const colors = {
      player:"#c2ee75",note:"#d6a3ff",loot:"#ffd369",
      exit:"#69caff",route:"#ffffff"
    };

    const title = m.name || (
      m.type === "route"
        ? t("routePoint")+" "+symbols.route
        : t(m.type)
    );

    const marker = L.marker(positionToLatLng(m),{
      icon:icon(symbols[m.type],colors[m.type],true),
      title,
      draggable:true,
      zIndexOffset:1000,
      bubblingMouseEvents:false
    }).bindPopup(popup(title,"",t(m.type),m.id)).addTo(ownLayer);

    marker.on("dragstart",snapshot);
    marker.on("dragend",() => {
      Object.assign(m,latLngToPosition(marker.getLatLng()));
      save();
      drawOwn();
    });
  });

  drawCommunity();
}

async function fetchData(file,force){
  if(dataCache.has(file) && !force) return dataCache.get(file);

  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(),25000);

  try {
    const response = await fetch(
      ROOT+"coordinates/"+file+".json"+
      (force ? "?refresh="+Date.now() : ""),
      {signal:controller.signal}
    );

    if(!response.ok) throw new Error("Data unavailable");
    const d = await response.json();

    if(
      d.origin!=="bottom-left" ||
      d.coordinateOrder!=="xy" ||
      !Array.isArray(d.categories) ||
      !Array.isArray(d.markers) ||
      !Array.isArray(d.mapBounds) ||
      d.mapBounds.length!==2 ||
      !d.mapBounds.every(p =>
        Array.isArray(p) && p.length===2 && p.every(Number.isFinite)
      ) ||
      d.mapBounds[1][0]<=d.mapBounds[0][0] ||
      d.mapBounds[1][1]<=d.mapBounds[0][1]
    ) throw new Error("Invalid map data");

    d.categories = d.categories.filter(c =>
      c && c.id!=null && typeof c.name==="string"
    );

    d.markers = d.markers.filter(m =>
      m && Array.isArray(m.position) &&
      m.position.length===2 && m.position.every(Number.isFinite)
    );

    dataCache.set(file,d);
    return d;
  } finally {
    clearTimeout(timer);
  }
}

function preloadImage(url){
  return new Promise((resolve,reject) => {
    const img = new Image();

    const timer = setTimeout(() => {
      img.onload = img.onerror = null;
      img.src = "";
      reject(new Error("Image timeout"));
    },60000);

    img.onload = () => {
      clearTimeout(timer);
      resolve(img);
    };

    img.onerror = () => {
      clearTimeout(timer);
      reject(new Error("Image unavailable"));
    };

    img.src = url;
  });
}

async function loadSelected(force=false){
  if(!leafletMap) return;

  const token = ++requestId;
  const id = selected;
  const s = state();
  const config = configs[id];

  loading = true;
  currentData = null;
  bounds = null;

  if(imageLayer){
    leafletMap.removeLayer(imageLayer);
    imageLayer = null;
  }

  communityLayer.clearLayers();
  ownLayer.clearLayers();
  leafletMap.closePopup();
  leafletMap.setMaxBounds(null);
  $("categories").replaceChildren();
  $("results").replaceChildren();
  updateSummary(0);
  setStatus("loading");
  translate();

  const imageUrl = s.image || (
    config.file ? ROOT+"maps/"+config.file+".png" : ""
  );

  if(!imageUrl){
    loading = false;
    setStatus("missing");
    translate();
    return;
  }

  const results = await Promise.allSettled([
    preloadImage(imageUrl),
    config.file && !s.image
      ? fetchData(config.file,force)
      : Promise.resolve(null)
  ]);

  if(token!==requestId) return;

  loading = false;

  if(results[0].status!=="fulfilled"){
    setStatus("failed");
    translate();
    return;
  }

  const img = results[0].value;
  const data = results[1].status==="fulfilled"
    ? results[1].value : null;

  currentData = data;

  if(data){
    const [[x0,y0],[x1,y1]] = data.mapBounds;
    bounds = L.latLngBounds([y0,x0],[y1,x1]);
  } else {
    bounds = L.latLngBounds(
      [0,0],
      [1080,1080*img.naturalWidth/img.naturalHeight]
    );
  }

  imageLayer = L.imageOverlay(imageUrl,bounds,{
    interactive:false,
    alt:config.name
  }).addTo(leafletMap);

  imageLayer.on("error",() => {
    if(token===requestId) setStatus("failed");
  });

  leafletMap.setMaxBounds(bounds.pad(.25));
  leafletMap.invalidateSize();
  leafletMap.fitBounds(bounds,{padding:[12,12],animate:false});

  buildFilters();
  drawOwn();

  setStatus(
    s.image ? "customReady" :
    data ? "ready" : "dataFailed"
  );

  translate();
}

$("language").addEventListener("click",() => {
  lang = lang==="de" ? "en" : "de";
  save();
  translate();
  buildFilters();
  drawOwn();
});

$("mapSelect").value = selected;
$("mapSelect").addEventListener("change",() => {
  selected = $("mapSelect").value;
  savePrefs();
  loadSelected();
});

document.querySelectorAll("[data-tool]").forEach(button => {
  button.addEventListener("click",() => {
    tool = button.dataset.tool;
    translate();
  });
});

$("search").addEventListener("input",drawCommunity);

$("showAll").addEventListener("click",() => {
  hidden.clear();
  savePrefs();
  buildFilters();
  drawCommunity();
});

$("hideAll").addEventListener("click",() => {
  currentData?.categories.forEach(c => hidden.add(c.name));
  savePrefs();
  buildFilters();
  drawCommunity();
});

$("refresh").addEventListener("click",() => loadSelected(true));

$("fit").addEventListener("click",() => {
  if(bounds) leafletMap.fitBounds(bounds,{padding:[12,12]});
});

$("undo").addEventListener("click",() => {
  const stack = undoStacks[selected];
  if(!stack?.length) return;
  state().markers = stack.pop();
  save();
  drawOwn();
});

$("clearOwn").addEventListener("click",() => {
  if(!state().markers.length || !confirm(t("confirmClear"))) return;
  snapshot();
  state().markers = [];
  save();
  drawOwn();
});

$("original").addEventListener("click",() => {
  if(!configs[selected].file || !state().image) return;
  if(state().markers.length && !confirm(t("confirmImage"))) return;

  state().image = "";
  state().markers = [];
  undoStacks[selected] = [];
  save();
  loadSelected();
});

$("upload").addEventListener("change",async event => {
  const file = event.target.files[0];
  event.target.value = "";

  if(!file) return;

  if(
    !["image/png","image/jpeg","image/webp"].includes(file.type) ||
    file.size>15*1024*1024
  ){
    setStatus("uploadFailed");
    return;
  }

  const target = selected;
  const s = state();

  if(s.markers.length && !confirm(t("confirmImage"))) return;

  const url = URL.createObjectURL(file);

  try {
    const img = await preloadImage(url);
    const scale = Math.min(
      1,1800/Math.max(img.naturalWidth,img.naturalHeight)
    );

    const canvas = document.createElement("canvas");
    canvas.width = Math.max(1,Math.round(img.naturalWidth*scale));
    canvas.height = Math.max(1,Math.round(img.naturalHeight*scale));

    const context = canvas.getContext("2d");
    context.fillStyle = "#101613";
    context.fillRect(0,0,canvas.width,canvas.height);
    context.drawImage(img,0,0,canvas.width,canvas.height);

    storedMaps[target] = {
      image:canvas.toDataURL("image/jpeg",.85),
      ratio:canvas.width/canvas.height,
      markers:[]
    };

    undoStacks[target] = [];
    save();

    if(selected===target) loadSelected();
  } catch(e){
    setStatus("uploadFailed");
  } finally {
    URL.revokeObjectURL(url);
  }
});

translate();

if(typeof L==="undefined"){
  setStatus("libraryFailed");
} else {
  leafletMap = L.map("map",{
    crs:L.CRS.Simple,
    minZoom:-6,
    maxZoom:3,
    zoomSnap:.25,
    zoomDelta:.5,
    scrollWheelZoom:true,
    touchZoom:true,
    dragging:true,
    doubleClickZoom:false,
    maxBoundsViscosity:.8
  }).setView([540,960],-2);

  communityLayer = L.layerGroup().addTo(leafletMap);
  ownLayer = L.layerGroup().addTo(leafletMap);

  leafletMap.on("click",event => {
    if(tool==="inspect") return;

    if(!bounds || !imageLayer){
      setStatus("empty");
      return;
    }

    if(!bounds.contains(event.latlng)) return;

    snapshot();

    if(tool==="player"){
      state().markers = state().markers.filter(m => m.type!=="player");
    }

    const position = latLngToPosition(event.latlng);

    state().markers.push({
      id:Date.now().toString(36)+Math.random().toString(36).slice(2),
      type:tool,
      name:$("markerName").value.trim(),
      ...position
    });

    save();
    drawOwn();
  });

  if(typeof ResizeObserver!=="undefined"){
    new ResizeObserver(() => {
      leafletMap.invalidateSize({pan:false});
    }).observe($("map"));
  }

  loadSelected();
}
</script>
