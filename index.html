<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#15191c">
<title>Arena Breakout · Black Steel Companion</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>
:root{
  color-scheme:dark;
  --orange:#ff8735;
  --text:#f0ede6;
  --muted:#c0c5bf;
  --armor:url("./armor-texture.PNG");
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{
  margin:0;color:var(--text);
  background:radial-gradient(ellipse at top,#394248,#151b1f 55%,#090d10);
  font:14px system-ui,sans-serif;
}
button,input,select,textarea{font:inherit}
button,select,input[type=text],.upload{
  border:1px solid #7b878d;border-radius:4px;
  color:var(--text);padding:11px 12px;
}
button,.upload{
  cursor:pointer;min-height:44px;
  background:linear-gradient(145deg,#465158,#29343a 50%,#182228);
  box-shadow:inset 0 1px 0 #c3ced344,inset 0 -2px 0 #0b1318,0 2px 5px #0006;
}
button:hover,.upload:hover{border-color:#ffb37b}
button:disabled{opacity:.45;cursor:default}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{
  outline:2px solid #ffb37b;outline-offset:3px;
}
button.active,button[aria-pressed=true],.orange{
  background:linear-gradient(145deg,#ffb16b,#f47e2b 60%,#c85919);
  color:#25180f;border-color:#ffc28c;font-weight:800;
  box-shadow:inset 0 1px 0 #ffe3c277,inset 0 -2px 0 #923c0c,0 0 13px #ff87352b;
}
input[type=text],select{
  background:linear-gradient(#121b20,#232d32);
  box-shadow:inset 0 2px 5px #0007;
  font-size:16px;min-height:44px;
}
input[type=checkbox]{accent-color:var(--orange)}
a{color:#ffb078}
header{
  max-width:1540px;margin:12px auto 0;padding:30px 36px;
  display:flex;justify-content:space-between;align-items:center;
  gap:15px;position:relative;flex-wrap:wrap;
  background-color:#252b2f;
  background-image:linear-gradient(#10151912,#10151928),var(--armor);
  background-size:100% 100%;
  border:2px solid #758086;border-radius:6px;
  box-shadow:inset 0 1px 0 #bcc7ca55,inset 0 -3px 0 #080d10,0 8px 25px #0008;
}
header:after{
  content:"";position:absolute;left:25px;right:25px;bottom:0;height:3px;
  background:linear-gradient(90deg,transparent,#ff8735 20%,#ffc58a 50%,#ff8735 80%,transparent);
  box-shadow:0 0 13px #ff873555;pointer-events:none;
}
.brand{
  font-size:clamp(20px,3.3vw,35px);font-weight:900;
  letter-spacing:.8px;text-shadow:0 3px 4px #000;
}
.brand small{
  display:block;color:#e2b084;font-size:10px;
  letter-spacing:2px;margin-top:7px;line-height:1.6;
}
.header-actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.weapon-link{
  display:inline-flex;align-items:center;justify-content:center;
  min-height:44px;padding:11px 16px;border:1px solid #ffc28c;
  border-radius:4px;text-decoration:none;
}
main{
  max-width:1568px;margin:auto;padding:16px 14px;
  display:grid;grid-template-columns:310px minmax(0,1fr);
  align-items:start;gap:16px;
}
.panel{
  background-color:#252d31;
  background-image:linear-gradient(#10171b33,#10171b44),var(--armor);
  background-size:100% 100%;
  border:2px solid #68767c;border-radius:5px;padding:20px;
  box-shadow:inset 0 1px 0 #b3c2c444,inset 0 -2px 0 #080f13,0 6px 18px #0006;
}
aside .panel{margin-bottom:14px}
h2{
  margin:0 0 14px;font-size:16px;font-weight:800;
  letter-spacing:.4px;text-shadow:0 2px 3px #000;
}
.field{display:block;font-size:12px;color:var(--muted);margin:13px 0 7px}
#markerName{width:100%}
.tools{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:12px}
.tools button{font-size:12px}
.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}
.actions button{font-size:12px}
.help{color:var(--muted);font-size:12px;line-height:1.6}
.upload{display:block;text-align:center;margin-top:13px;font-size:12px}
.upload input{position:absolute;width:1px;height:1px;opacity:0}
.upload:focus-within{outline:2px solid #ffb37b;outline-offset:3px}
#categories{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:12px}
#categories label{
  display:flex;align-items:flex-start;gap:6px;padding:9px 7px;
  min-height:44px;background:#141d23e8;border:1px solid #596970;
  border-radius:4px;font-size:12px;overflow-wrap:anywhere;
}
#categories input{margin:2px 0}
.map-panel{min-width:0}
.map-head{
  display:flex;justify-content:space-between;align-items:center;
  gap:10px;margin-bottom:15px;
}
.map-head h2{margin:0;font-size:20px}
.map-head button{font-size:12px}
.toolbar{
  display:grid;grid-template-columns:minmax(120px,1fr) auto auto;
  gap:8px;margin-bottom:12px;
}
.toolbar select{width:100%;min-width:0}
#keySearch{font-size:12px}
#filterToggle{display:none}
#search{width:100%;margin-bottom:13px}
#results{
  display:grid;gap:6px;max-height:200px;overflow:auto;margin-bottom:12px;
}
#results:empty{display:none}
#results button{text-align:left;font-size:12px;border-left:3px solid var(--orange)}
#map{
  height:calc(100dvh - 295px);min-height:460px;
  border:4px solid #101920;outline:1px solid #a0aaad66;
  border-radius:4px;background:#111a1b;
  box-shadow:0 0 0 5px #354147,0 9px 20px #0007;
}
.status-row{
  display:flex;align-items:center;justify-content:space-between;
  flex-wrap:wrap;gap:8px;margin-top:19px;
}
#status{font-size:12px;color:#ffb27a;line-height:1.6}
#summary{font-size:12px;color:#c2c9c1;line-height:1.6}
.legend{
  display:flex;gap:12px;flex-wrap:wrap;margin-top:13px;
  color:var(--muted);font-size:12px;
}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}
#drawerClose{display:none}
.backdrop{display:none}
footer{text-align:center;padding:6px 16px 24px;color:var(--muted);font-size:11px;line-height:1.7}
.small-map-icon{background:none;border:0;display:grid;place-items:center}
.small-map-icon .hit{width:28px;height:28px;display:grid;place-items:center}
.small-map-icon img{
  width:18px;height:18px;object-fit:contain;
  filter:drop-shadow(0 1px 2px #000);pointer-events:none;
}
.small-map-icon:hover img{
  filter:drop-shadow(0 0 2px white) drop-shadow(0 1px 2px #000);
}
.personal-dot{
  width:22px;height:22px;display:grid;place-items:center;
  border:2px solid #fff;border-radius:50%;color:#111;
  font-size:10px;font-weight:850;box-shadow:0 2px 5px #0009;
}
.leaflet-control-zoom{
  border:1px solid #859298!important;border-radius:4px!important;overflow:hidden;
}
.leaflet-control-zoom a{
  background:linear-gradient(#435059,#1b272e)!important;
  color:#fff0de!important;border-color:#697a83!important;
  width:40px!important;height:40px!important;line-height:40px!important;
}
.leaflet-popup-content-wrapper{
  color:var(--text);background-color:#202a30;
  background-image:linear-gradient(#11191ee0,#11191ee8),var(--armor);
  background-size:cover;border:1px solid #8f7760;
  border-left:3px solid var(--orange);border-radius:4px;
  box-shadow:0 6px 22px #0008;
}
.leaflet-popup-tip{background:#27343b}
.leaflet-popup-content{min-width:190px;max-width:280px;line-height:1.6}
.leaflet-popup-content h3{font-size:16px;margin:0 0 8px;color:#ffb47e}
.leaflet-popup-content p{margin:8px 0;white-space:pre-line}
.leaflet-popup-content small{color:#c3c8c0}
.leaflet-popup-content button{margin-top:12px;font-size:12px}
.leaflet-popup-close-button{color:#f4dac5!important}
.leaflet-control-attribution{background:#131c22e8!important;color:#c3cac6!important}
.leaflet-control-attribution a{color:#ffb17b!important}
@media(max-width:850px){
  header{margin:8px 8px 0;padding:25px 21px}
  header #language{min-width:44px;padding:8px}
  main{display:block;padding:12px 8px}
  .map-panel{padding:20px 14px}
  #map{height:57dvh;min-height:360px}
  .toolbar{grid-template-columns:minmax(0,1fr) auto}
  #filterToggle{display:block}
  #keySearch{grid-column:1/-1}
  aside{
    position:fixed;left:8px;right:8px;bottom:8px;max-height:82dvh;
    overflow:auto;z-index:2100;background:#182126;
    border:2px solid #77858b;border-radius:10px;padding:12px;
    box-shadow:0 -10px 40px #0009;
  }
  aside .panel{padding:18px;margin-bottom:10px}
  #drawerClose{display:block;margin:0 0 12px auto}
  .backdrop{
    position:fixed;inset:0;background:#0009;z-index:2000;
    border:0;border-radius:0;width:100%;height:100%;box-shadow:none;
  }
  .backdrop:not([hidden]){display:block}
  body.drawer-open{overflow:hidden}
  .legend{gap:10px}
}
@media(prefers-reduced-motion:reduce){
  *{scroll-behavior:auto!important}
}
</style>
</head>
<body>

<header>
  <div class="brand">
    ARENA BREAKOUT
    <small>BLACK STEEL / ARMORED EDITION</small>
  </div>
  <div class="header-actions">
    <a href="./waffen.html" class="orange weapon-link">Waffenwerkbank</a>
    <button id="language" type="button">EN</button>
  </div>
</header>

<button class="backdrop" id="backdrop" type="button"
  aria-label="Filter schließen" hidden></button>

<main>
<aside id="drawer" aria-label="Filter und eigene Planung">
  <button id="drawerClose" type="button" data-text="close"></button>

  <section class="panel">
    <h2 data-text="planning"></h2>
    <label for="markerName" class="field" data-text="name"></label>
    <input id="markerName" type="text" maxlength="80">

    <div class="tools">
      <button type="button" data-tool="inspect" data-text="inspect"></button>
      <button type="button" data-tool="player" data-text="player"></button>
      <button type="button" data-tool="note" data-text="note"></button>
      <button type="button" data-tool="loot" data-text="loot"></button>
      <button type="button" data-tool="exit" data-text="exit"></button>
      <button type="button" data-tool="route" data-text="route"></button>
    </div>

    <p class="help" data-text="instructions"></p>
    <div class="actions">
      <button type="button" id="undo" data-text="undo"></button>
      <button type="button" id="clearOwn" data-text="clearOwn"></button>
    </div>

    <label class="upload">
      <span data-text="upload"></span>
      <input id="upload" type="file" accept="image/png,image/jpeg,image/webp">
    </label>

    <div class="actions">
      <button type="button" id="original" data-text="original"></button>
    </div>
  </section>

  <section class="panel">
    <h2 data-text="filters"></h2>
    <div class="actions">
      <button type="button" id="showAll" data-text="showAll"></button>
      <button type="button" id="hideAll" data-text="hideAll"></button>
    </div>
    <div id="categories"></div>
    <p class="help" data-text="keyNotice"></p>
  </section>
</aside>

<section class="panel map-panel">
  <div class="map-head">
    <h2 id="mapTitle">Farm</h2>
    <button id="fit" type="button" data-text="fit"></button>
  </div>

  <div class="toolbar">
    <select id="mapSelect" aria-label="Karte">
      <option value="farm">Farm</option>
      <option value="valley">Valley</option>
      <option value="armory">Armory</option>
      <option value="tv">TV Station</option>
      <option value="northridge">Northridge</option>
      <option value="custom">Eigene Karte</option>
    </select>
    <button id="filterToggle" type="button"
      aria-controls="drawer" aria-expanded="false"
      data-text="filters"></button>
    <button id="keySearch" type="button" class="orange"
      aria-pressed="false"></button>
  </div>

  <input id="search" type="text" maxlength="100">
  <div id="results"></div>
  <div id="map" aria-label="Interaktive Karte"></div>

  <div class="status-row">
    <div id="status" role="status" aria-live="polite"></div>
    <button id="refresh" type="button" data-text="refresh"></button>
  </div>

  <div id="summary"></div>
  <div class="legend">
    <span><i class="dot" style="background:#69caff"></i><span data-text="exit"></span></span>
    <span><i class="dot" style="background:#ffd369"></i>Safes</span>
    <span><i class="dot" style="background:#d6a3ff"></i><span data-text="keys"></span></span>
    <span><i class="dot" style="background:#c2ee75"></i><span data-text="spawns"></span></span>
  </div>

  <p class="help" data-text="notice"></p>
</section>
</main>

<footer>
  <span data-text="footer"></span> ·
  <a href="https://github.com/nicolasaigner/ABI-InteractiveMaps"
    target="_blank" rel="noopener noreferrer">ABI-InteractiveMaps</a> ·
  <a href="https://github.com/nicolasaigner/ABI-InteractiveMaps/blob/main/LICENSE"
    target="_blank" rel="noopener noreferrer">MIT</a> ·
  <a href="https://www.reddit.com/r/ArenaBreakoutInfinite/comments/1d6znjl/"
    target="_blank" rel="noopener noreferrer" data-text="keySource"></a>
</footer>

  "Player Spawn":"Spieler-Spawn",
  "Player spawn (Lockdown)":"Spieler-Spawn (Lockdown)",

const candidateNames=new Set(["Jacket","Filing Cabinet","Suitcase"]);
const ownTypes=["player","note","loot","exit","route"];
const STORAGE="abi-companion-planner-v1";
const PREFS="abi-interactive-preferences-v1";
const dataCache=new Map();
const media=window.matchMedia("(max-width:850px)");

let lang="de",selected="farm",tool="inspect";
let storedMaps={},undoStacks={},hidden=new Set();
let keyMode=false,drawerOpen=false,loading=false;
let leafletMap,imageLayer,communityLayer,ownLayer;
let bounds=null,currentData=null,requestId=0;
let statusKey="loading";

try{
  const saved=JSON.parse(localStorage.getItem(STORAGE)||"null");
  if(saved&&typeof saved==="object"){
    lang=saved.lang==="en"?"en":"de";
    for(const [id,s]of Object.entries(saved.maps||{})){
      if(!configs[id]||!s||typeof s!=="object")continue;
      storedMaps[id]={
        image:typeof s.image==="string"&&
          /^data:image\/(png|jpeg|webp);base64,/.test(s.image)
          ?s.image:"",
        ratio:Number.isFinite(s.ratio)&&s.ratio>0?s.ratio:1,
        markers:Array.isArray(s.markers)
          ?s.markers.filter(m=>
            m&&ownTypes.includes(m.type)&&
            typeof m.id==="string"&&
            Number.isFinite(m.x)&&Number.isFinite(m.y)&&
            m.x>=0&&m.x<=100&&m.y>=0&&m.y<=100
          ).map(m=>({...m,name:String(m.name||"").slice(0,80)}))
          :[]
      };
    }
  }
}catch(e){}

try{
  const prefs=JSON.parse(localStorage.getItem(PREFS)||"{}");
  if(configs[prefs.selected])selected=prefs.selected;
  if(Array.isArray(prefs.hidden)){
    hidden=new Set(prefs.hidden.filter(x=>typeof x==="string"));
  }
  keyMode=prefs.keyMode===true;
}catch(e){}

function t(key){return words[lang][key]||key}
function categoryName(name){return lang==="de"?german[name]||name:name}

function state(){
  if(!storedMaps[selected]){
    storedMaps[selected]={image:"",ratio:1,markers:[]};
  }
  return storedMaps[selected];
}

function setStatus(key){
  statusKey=key;
  $("status").textContent=t(key);
}

function savePrefs(){
  try{
    localStorage.setItem(PREFS,JSON.stringify({
      selected,hidden:[...hidden],keyMode
    }));
  }catch(e){}
}

function save(){
  try{
    localStorage.setItem(STORAGE,JSON.stringify({
      lang,maps:storedMaps
    }));
    savePrefs();
    setStatus("saved");
  }catch(e){setStatus("saveFailed")}
}

function snapshot(){
  const stack=undoStacks[selected]||=[];
  stack.push(state().markers.map(m=>({...m})));
  if(stack.length>30)stack.shift();
}

function updateDrawer(){
  $("drawer").hidden=media.matches&&!drawerOpen;
  $("backdrop").hidden=!media.matches||!drawerOpen;
  $("filterToggle").setAttribute("aria-expanded",String(media.matches&&drawerOpen));
  document.body.classList.toggle("drawer-open",media.matches&&drawerOpen);
}

function closeDrawer(){
  drawerOpen=false;
  updateDrawer();
}

function translate(){
  document.documentElement.lang=lang;
  document.querySelectorAll("[data-text]").forEach(el=>{
    el.textContent=t(el.dataset.text);
  });
  $("language").textContent=lang==="de"?"EN":"DE";
  $("search").placeholder=t("search");
  $("search").setAttribute("aria-label",t("search"));
  $("mapSelect").setAttribute("aria-label",t("mapLabel"));
  $("drawer").setAttribute("aria-label",t("planning")+" · "+t("filters"));
  $("backdrop").setAttribute("aria-label",t("close"));
  $("markerName").placeholder=lang==="de"?"z. B. Treffpunkt":"e.g. Meeting point";
  $("mapSelect").querySelector('[value="northridge"]').textContent=
    "Northridge · "+t("ownImage");
  $("mapSelect").querySelector('[value="custom"]').textContent=t("custom");
  $("mapTitle").textContent=selected==="custom"?t("custom"):configs[selected].name;
  $("keySearch").textContent=keyMode?t("keyOn"):t("keyOff");
  $("keySearch").setAttribute("aria-pressed",String(keyMode));
  $("status").textContent=t(statusKey);

  document.querySelectorAll("[data-tool]").forEach(button=>{
    const active=button.dataset.tool===tool;
    button.classList.toggle("active",active);
    button.setAttribute("aria-pressed",String(active));
  });

  $("original").hidden=!configs[selected].file||!state().image;
  $("refresh").disabled=loading;
  $("undo").disabled=!(undoStacks[selected]?.length);
  $("clearOwn").disabled=!state().markers.length;
  updateDrawer();
}

function communityIcon(category,isCandidate){
  const wrapper=document.createElement("div");
  wrapper.className="hit";
  const filename=keyMode&&isCandidate?"Keysico.png":categoryIcons[category.name];

  if(filename){
    const image=document.createElement("img");
    image.src=ROOT+"icons/"+encodeURIComponent(filename);
    image.alt="";
    image.draggable=false;
    image.addEventListener("error",()=>{
      wrapper.replaceChildren();
      wrapper.textContent="●";
      wrapper.style.color="#ffb079";
    });
    wrapper.append(image);
  }else{
    wrapper.textContent="●";
    wrapper.style.color="#e0d4bd";
  }

  return L.divIcon({
    html:wrapper,className:"small-map-icon",
    iconSize:[28,28],iconAnchor:[14,14],popupAnchor:[0,-12]
  });
}

function personalIcon(type,index){
  const symbols={player:"P",note:"N",loot:"L",exit:"E",route:String(index)};
  const colors={
    player:"#c2ee75",note:"#d6a3ff",loot:"#ffd369",
    exit:"#69caff",route:"#fff"
  };
  const wrapper=document.createElement("div");
  wrapper.className="hit";
  const dot=document.createElement("div");
  dot.className="personal-dot";
  dot.textContent=symbols[type];
  dot.style.background=colors[type];
  wrapper.append(dot);

  return L.divIcon({
    html:wrapper,className:"small-map-icon",
    iconSize:[28,28],iconAnchor:[14,14],popupAnchor:[0,-12]

function makePopup(title,description,category,personalId){
  const box=document.createElement("div");
  const heading=document.createElement("h3");
  heading.textContent=title;
  box.append(heading);

  if(category){
    const paragraph=document.createElement("p");
    paragraph.textContent=category;
    box.append(paragraph);
  }
  if(description){
    const paragraph=document.createElement("p");
    paragraph.textContent=description;
    box.append(paragraph);
  }

  const small=document.createElement("small");
  small.textContent=personalId?t("own"):t("source");
  box.append(small);

  if(personalId){
    const button=document.createElement("button");
    button.type="button";
    button.textContent=t("delete");
    button.addEventListener("click",()=>{
      snapshot();
      state().markers=state().markers.filter(m=>m.id!==personalId);
      save();
      drawOwn();
    });
    box.append(document.createElement("br"),button);
  }

  L.DomEvent.disableClickPropagation(box);
  return box;
}

function positionToLatLng(marker){
  const sw=bounds.getSouthWest(),ne=bounds.getNorthEast();
  return [
    ne.lat-marker.y/100*(ne.lat-sw.lat),
    sw.lng+marker.x/100*(ne.lng-sw.lng)
  ];
}

function latLngToPosition(latlng){
  const sw=bounds.getSouthWest(),ne=bounds.getNorthEast();
  return {
    x:Math.max(0,Math.min(100,(latlng.lng-sw.lng)/(ne.lng-sw.lng)*100)),
    y:Math.max(0,Math.min(100,(ne.lat-latlng.lat)/(ne.lat-sw.lat)*100))
  };
}

function updateSummary(count){
  $("summary").textContent=
    count+" "+t("visible")+" · "+
    state().markers.length+" "+t("personal")+
    (keyMode?" · "+t("keyMode"):"");
}

function buildFilters(){
  $("categories").replaceChildren();
  if(!currentData)return;

  const counts=new Map();
  currentData.markers.forEach(marker=>{
    const id=String(marker.categoryId);
    counts.set(id,(counts.get(id)||0)+1);
  });

  currentData.categories.forEach(category=>{
    if(keyMode&&!candidateNames.has(category.name))return;
    const label=document.createElement("label");
    const checkbox=document.createElement("input");
    checkbox.type="checkbox";
    checkbox.checked=!hidden.has(category.name);
    checkbox.addEventListener("change",()=>{
      if(checkbox.checked)hidden.delete(category.name);
      else hidden.add(category.name);
      savePrefs();
      drawCommunity();
    });
    label.append(
      checkbox,
      document.createTextNode(categoryName(category.name)+" ("+
        (counts.get(String(category.id))||0)+")")
    );
    $("categories").append(label);
  });
}

function drawCommunity(){
  if(!communityLayer)return;
  communityLayer.clearLayers();
  $("results").replaceChildren();
  const query=$("search").value.trim().toLowerCase();
  const matches=[];
  let count=0;

  if(currentData&&!state().image&&imageLayer){
    const cats=new Map(currentData.categories.map(c=>[String(c.id),c]));
    currentData.markers.forEach(markerData=>{
      const category=cats.get(String(markerData.categoryId));
      if(!category||hidden.has(category.name))return;

      const candidate=candidateNames.has(category.name);
      if(keyMode&&!candidate)return;

      const title=String(markerData.popup?.title||category.name);
      let description=String(markerData.popup?.description||"");
      if(keyMode){
        description=t("keyHint")+(description?"\n\n"+description:"");
      }

      const searchable=[
        title,description,category.name,categoryName(category.name)
      ].join(" ").toLowerCase();
      if(query&&!searchable.includes(query))return;

      const latlng=L.latLng(markerData.position[1],markerData.position[0]);
      if(!bounds.contains(latlng))return;

      const marker=L.marker(latlng,{
        icon:communityIcon(category,candidate),
        title:categoryName(category.name)+": "+title,
        bubblingMouseEvents:false
      }).bindPopup(
        makePopup(title,description,categoryName(category.name))
      ).addTo(communityLayer);

      count++;
      if(query)matches.push({title,category,marker});
    });
  }

  if(query){
    matches.slice(0,40).forEach(item=>{
      const button=document.createElement("button");
      button.type="button";
      button.textContent=categoryName(item.category.name)+" · "+item.title;
      button.addEventListener("click",()=>{
        closeDrawer();
        leafletMap.setView(item.marker.getLatLng(),Math.max(leafletMap.getZoom(),-1));
        item.marker.openPopup();
      });
      $("results").append(button);
    });

    if(!matches.length||matches.length>40){
      const paragraph=document.createElement("p");
      paragraph.className="help";
      paragraph.textContent=matches.length?t("limited"):t("noResults");
      $("results").append(paragraph);
    }
  }
  updateSummary(count);
}

function drawOwn(){
  if(!ownLayer)return;
  ownLayer.clearLayers();
  translate();
  if(!bounds||!imageLayer){
    drawCommunity();
    return;
  }

  const route=state().markers.filter(m=>m.type==="route");
  if(route.length>1){
    L.polyline(route.map(positionToLatLng),{
      color:"#ff963f",weight:3,dashArray:"8 6",interactive:false
    }).addTo(ownLayer);
  }

  state().markers.forEach(markerData=>{
    const index=route.findIndex(r=>r.id===markerData.id)+1;
    const title=markerData.name||
      (markerData.type==="route"?t("routePoint")+" "+index:t(markerData.type));

    const marker=L.marker(positionToLatLng(markerData),{
      icon:personalIcon(markerData.type,index),
      title,draggable:true,zIndexOffset:1000,
      bubblingMouseEvents:false
    }).bindPopup(
      makePopup(title,"",t(markerData.type),markerData.id)
    ).addTo(ownLayer);

    marker.on("dragstart",snapshot);
    marker.on("dragend",()=>{
      Object.assign(markerData,latLngToPosition(marker.getLatLng()));
      save();
      drawOwn();
    });
  });
  drawCommunity();
}

async function fetchData(file,force){
  if(dataCache.has(file)&&!force)return dataCache.get(file);
  const controller=new AbortController();
  const timer=setTimeout(()=>controller.abort(),25000);

  try{
    const response=await fetch(
      ROOT+"coordinates/"+file+".json"+
      (force?"?refresh="+Date.now():""),
      {signal:controller.signal}
    );
    if(!response.ok)throw new Error("Data unavailable");
    const data=await response.json();

    if(
      data.origin!=="bottom-left"||
      data.coordinateOrder!=="xy"||
      !Array.isArray(data.categories)||
      !Array.isArray(data.markers)||
      !Array.isArray(data.mapBounds)||
      data.mapBounds.length!==2||
      !data.mapBounds.every(p=>
        Array.isArray(p)&&p.length===2&&p.every(Number.isFinite))||
      data.mapBounds[1][0]<=data.mapBounds[0][0]||
      data.mapBounds[1][1]<=data.mapBounds[0][1]
    )throw new Error("Invalid map data");

    data.categories=data.categories.filter(c=>
      c&&c.id!=null&&typeof c.name==="string");
    data.markers=data.markers.filter(m=>
      m&&Array.isArray(m.position)&&m.position.length===2&&
      m.position.every(Number.isFinite));

    dataCache.set(file,data);
    return data;
  }finally{clearTimeout(timer)}
}

function preloadImage(url){
  return new Promise((resolve,reject)=>{
    const image=new Image();
    const timer=setTimeout(()=>{
      image.onload=image.onerror=null;
      image.src="";
      reject(new Error("Image timeout"));
    },60000);
    image.onload=()=>{
      clearTimeout(timer);
      resolve(image);
    };
    image.onerror=()=>{
      clearTimeout(timer);
      reject(new Error("Image unavailable"));
    };
    image.src=url;
  });
}

async function loadSelected(force=false){
  if(!leafletMap)return;
  const token=++requestId;
  const s=state(),config=configs[selected];

  loading=true;
  currentData=null;
  bounds=null;

  if(imageLayer){
    leafletMap.removeLayer(imageLayer);
    imageLayer=null;
  }
  communityLayer.clearLayers();
  ownLayer.clearLayers();
  leafletMap.closePopup();
  leafletMap.setMaxBounds(null);
  $("categories").replaceChildren();
  $("results").replaceChildren();
  updateSummary(0);
  setStatus("loading");
  translate();

  const imageUrl=s.image||(config.file?ROOT+"maps/"+config.file+".png":"");
  if(!imageUrl){
    loading=false;
    setStatus("missing");
    translate();
    return;
  }

  const results=await Promise.allSettled([
    preloadImage(imageUrl),
    config.file&&!s.image?fetchData(config.file,force):Promise.resolve(null)
  ]);

  if(token!==requestId)return;
  loading=false;

  if(results[0].status!=="fulfilled"){
    setStatus("failed");
    translate();
    return;
  }

  const image=results[0].value;
  const data=results[1].status==="fulfilled"?results[1].value:null;
  currentData=data;

  if(data){
    const [[x0,y0],[x1,y1]]=data.mapBounds;
    bounds=L.latLngBounds([y0,x0],[y1,x1]);
  }else{
    bounds=L.latLngBounds(
      [0,0],[1080,1080*image.naturalWidth/image.naturalHeight]
    );
  }

  imageLayer=L.imageOverlay(imageUrl,bounds,{
    interactive:false,alt:config.name
  }).addTo(leafletMap);

  imageLayer.on("error",()=>{
    if(token===requestId)setStatus("failed");
  });

  leafletMap.setMaxBounds(bounds.pad(.25));
  leafletMap.invalidateSize();
  leafletMap.fitBounds(bounds,{padding:[12,12],animate:false});
  buildFilters();
  drawOwn();
  setStatus(s.image?"customReady":data?"ready":"dataFailed");
  translate();
}

  save();

$("fit").addEventListener("click",()=>{
  if(bounds&&leafletMap){

  }
});

$("undo").addEventListener("click",()=>{
  const stack=undoStacks[selected];
  if(!stack?.length)return;
  state().markers=stack.pop();
  save();
  drawOwn();
});

$("clearOwn").addEventListener("click",()=>{
  if(!state().markers.length||!confirm(t("confirmClear")))return;
  snapshot();
  state().markers=[];
  save();
  drawOwn();
});

$("original").addEventListener("click",()=>{
  if(!configs[selected].file||!state().image)return;
  if(state().markers.length&&!confirm(t("confirmImage")))return;
  state().image="";
  state().markers=[];
  undoStacks[selected]=[];
  save();
  closeDrawer();
  loadSelected();
});

$("upload").addEventListener("change",async event=>{
  const file=event.target.files[0];
  event.target.value="";
  if(!file)return;
  if(!["image/png","image/jpeg","image/webp"].includes(file.type)||
    file.size>15*1024*1024){
    setStatus("uploadFailed");
    return;
  }

  const target=selected,s=state();
  if(s.markers.length&&!confirm(t("confirmImage")))return;
  const url=URL.createObjectURL(file);

  try{
    const image=await preloadImage(url);
    const scale=Math.min(1,1800/Math.max(image.naturalWidth,image.naturalHeight));
    const canvas=document.createElement("canvas");
    canvas.width=Math.max(1,Math.round(image.naturalWidth*scale));
    canvas.height=Math.max(1,Math.round(image.naturalHeight*scale));
    const context=canvas.getContext("2d");
    context.fillStyle="#101613";
    context.fillRect(0,0,canvas.width,canvas.height);
    context.drawImage(image,0,0,canvas.width,canvas.height);

    storedMaps[target]={
      image:canvas.toDataURL("image/jpeg",.85),
      ratio:canvas.width/canvas.height,
      markers:[]
    };
    undoStacks[target]=[];
    save();

    if(selected===target){
      closeDrawer();
      loadSelected();
    }
  }catch(e){
    setStatus("uploadFailed");
  }finally{URL.revokeObjectURL(url)}
});

translate();

if(typeof L==="undefined"){
  setStatus("libraryFailed");
}else{
  leafletMap=L.map("map",{
    crs:L.CRS.Simple,
    minZoom:-6,maxZoom:3,zoomSnap:.25,zoomDelta:.5,
    scrollWheelZoom:true,touchZoom:true,dragging:true,
    doubleClickZoom:false,maxBoundsViscosity:.8
  }).setView([540,960],-2);

  communityLayer=L.layerGroup().addTo(leafletMap);
  ownLayer=L.layerGroup().addTo(leafletMap);

  leafletMap.on("click",event=>{
    if(tool==="inspect")return;
    if(!bounds||!imageLayer){
      setStatus("empty");
      return;
    }
    if(!bounds.contains(event.latlng))return;
    snapshot();
    if(tool==="player"){
      state().markers=state().markers.filter(m=>m.type!=="player");
    }
    state().markers.push({
      id:Date.now().toString(36)+Math.random().toString(36).slice(2),
      type:tool,
      name:$("markerName").value.trim(),
      ...latLngToPosition(event.latlng)
    });
    save();
    drawOwn();
  });

  if(typeof ResizeObserver!=="undefined"){
    new ResizeObserver(()=>{
      leafletMap.invalidateSize({pan:false});
    }).observe($("map"));
  }

  loadSelected();
}
</script>

function persist(){
  try{
    localStorage.setItem(KEY,JSON.stringify({plans,draft,catalog}));
    return true;
  }catch(e){
    say("Speicher voll oder gesperrt. Änderungen bleiben nur in dieser Sitzung.");
    return false;
  }
}

function option(select,value,label){
  const o=document.createElement("option");
  o.value=value;
  o.textContent=label;
  select.append(o);
}
for(const [id,c]of Object.entries(configs))option(el("Map"),id,c.name);

function savedList(){
  el("Saved").replaceChildren();
  option(el("Saved"),"","Plan auswählen …");
  for(const p of plans){
    option(el("Saved"),p.id,p.name+" · "+configs[p.map].name);
  }
  el("Saved").value=plans.some(p=>p.id===draft.id)?draft.id:"";
}

function buildList(){
  el("Build").replaceChildren();
  option(el("Build"),"","Ohne Build");
  for(const b of catalog)option(el("Build"),b.id,b.name);
  if(draft.build&&!catalog.some(b=>b.id===draft.build)){
    option(el("Build"),draft.build,"Gespeicherter Build – Liste bitte laden");
  }
  el("Build").value=draft.build;
  buildInfo();
}

function buildInfo(){
  const b=catalog.find(b=>b.id===draft.build);
  el("BuildInfo").textContent=b?b.warning:catalog.length
    ?catalog.length+" Builds verfügbar."
    :"Buildliste von deiner Waffen-Seite laden.";
  el("Parts").textContent=b
    ?b.parts.length
      ?b.parts.map(p=>p[0]+": "+p[1]).join("\n")
      :"Für diesen Build ist keine Aufsatzliste hinterlegt."
    :"Build auswählen.";
  el("Code").textContent=b?.code||"Kein Importcode ausgewählt.";
  el("Copy").disabled=!b?.code;
}

function checks(){
  el("Checks").replaceChildren();
  draft.checks.forEach((c,index)=>{
    const label=document.createElement("label");
    const input=document.createElement("input");
    input.type="checkbox";
    input.checked=c.done;
    const span=document.createElement("span");
    span.textContent=c.label;
    input.addEventListener("change",()=>{
      c.done=input.checked;
      persist();
    });
    const remove=document.createElement("button");
    remove.type="button";
    remove.textContent="×";
    remove.setAttribute("aria-label",c.label+" entfernen");
    remove.addEventListener("click",e=>{
      e.preventDefault();
      draft.checks.splice(index,1);
      persist();
      checks();
    });
    label.append(input,span,remove);
    el("Checks").append(label);
  });
}

function routeList(){
  el("RouteList").replaceChildren();
  draft.route.forEach((point,index)=>{
    const li=document.createElement("li");
    const name=document.createElement("span");
    name.textContent=point.name;
    li.append(name);
    for(const [label,delta]of [["↑",-1],["↓",1],["×",0]]){
      const b=document.createElement("button");
      b.type="button";
      b.textContent=label;
      b.setAttribute("aria-label",delta
        ?"Routenpunkt "+(index+1)+" "+(delta<0?"nach oben":"nach unten")
        :"Routenpunkt "+(index+1)+" entfernen");
      b.disabled=delta!==0&&(
        index+delta<0||index+delta>=draft.route.length
      );
      b.addEventListener("click",()=>{
        if(!delta)draft.route.splice(index,1);
        else{
          [draft.route[index],draft.route[index+delta]]=
            [draft.route[index+delta],draft.route[index]];
        }
        persist();
        routeList();
        drawRoute();
      });
      li.append(b);
    }
    el("RouteList").append(li);
  });
  el("MapCount").textContent=
    draft.route.length+" Routenpunkte · "+configs[draft.map].name;
}

function fill(){
  for(const [id,key]of [
    ["Name","name"],["Map","map"],["Goal","goal"],
    ["Armor","armor"],["Ammo","ammo"],["Notes","notes"]

function drawRoute(){
  if(!leafletMap||typeof L==="undefined")return;
  if(!layer)layer=L.layerGroup().addTo(leafletMap);
  layer.clearLayers();
  if(!bounds||!imageLayer||selected!==draft.map||loading)return;
  const points=draft.route.map(positionToLatLng);
  if(points.length>1){
    L.polyline(points,{
      color:"#ff963f",weight:3,dashArray:"7 5",interactive:false
    }).addTo(layer);
  }
  points.forEach((latlng,index)=>{
    const icon=L.divIcon({
      className:"",
      html:'<div class="rpPoint">'+(index+1)+'</div>',
      iconSize:[28,28],iconAnchor:[14,14]
    });
    L.marker(latlng,{
      icon,interactive:false,zIndexOffset:2000
    }).addTo(layer);
  });
}

let autoData=null,autoMap="",spawns=[],exits=[];

function mapPoints(){
  if(loading||selected!==draft.map||
    !currentData||!bounds||state().image)return [];
  const cats=new Map(
    currentData.categories.map(c=>[String(c.id),c.name])
  );
  return currentData.markers
    .filter(m=>Array.isArray(m.position)&&m.position.length===2&&
      m.position.every(Number.isFinite))
    .map(m=>({
      id:String(m.categoryId)+":"+m.position.join(","),
      x:m.position[0],y:m.position[1],
      category:cats.get(String(m.categoryId))||"",
      title:String(m.popup?.title||cats.get(String(m.categoryId))||"Marker"),
      description:String(m.popup?.description||"")
    }))
    .filter(p=>bounds.contains(L.latLng(p.y,p.x)));
}

const distance=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);

function lootCategories(){
  if(draft.goal==="Schlüssel looten"){
    return new Set(["Jacket","Filing Cabinet","Suitcase"]);
  }
  if(draft.goal==="Safes looten")return new Set(["Safe"]);
  if(draft.goal==="Waffenkisten looten"){
    return new Set(["Weapon Box","Military Supply Case","Military Supply Crate"]);
  }
  return null;
}

function autoChoices(){
  el("AutoHint").textContent=draft.goal==="Schlüssel looten"
    ?"Schlüssel-Kandidaten: Jacken, Aktenschränke und Koffer. Keine garantierten Schlüssel-Spawns."
    :"Automatische Routen sind für Safes, Schlüssel-Kandidaten und Waffenkisten verfügbar.";

  if(loading||selected!==draft.map)return;
  if(autoData===currentData&&autoMap===selected){
    el("Exit").value=draft.exit;
    return;
  }

  autoData=currentData;
  autoMap=selected;
  const all=mapPoints();
  spawns=all.filter(p=>/^player.*spawn/i.test(p.category));
  exits=all.filter(p=>p.category==="Extraction Point");

  el("Spawn").replaceChildren();
  option(el("Spawn"),"","Spawn auswählen …");
  spawns.forEach((p,i)=>{
    option(el("Spawn"),p.id,"Spawn "+(i+1)+" · "+p.title);
  });

  el("Exit").replaceChildren();
  option(el("Exit"),"","Ohne Ausgang");
  exits.forEach(p=>option(el("Exit"),p.id,p.title+" · Bedingungen prüfen"));
  if(!exits.some(p=>p.id===draft.exit))draft.exit="";
  el("Exit").value=draft.exit;
}

function bestOrder(start,points,end){
  let best=Infinity,result=[];
  function visit(last,remaining,path,cost){
    if(cost>=best)return;
    if(!remaining.length){
      const total=cost+(end?distance(last,end):0);
      if(total<best){
        best=total;
        result=path.slice();
      }
      return;
    }
    remaining.forEach((point,index)=>{
      visit(
        point,
        remaining.filter((_,i)=>i!==index),
        path.concat(point),
        cost+distance(last,point)
      );
    });
  }
  visit(start,points,[],0);
  return result;
}

function calculateRoute(start){
  if(loading||selected!==draft.map||!currentData||
    !bounds||!imageLayer||state().image){
    say("Bitte warten, bis eine Community-Karte vollständig geladen ist.");
    return;
  }

  const categories=lootCategories();
  if(!categories){
    say("Für dieses Ziel fehlen automatische Zielpunkte. Wähle Safes, Schlüssel looten oder Waffenkisten.");
    return;
  }

  const targets=mapPoints()
    .filter(p=>categories.has(p.category))
    .sort((a,b)=>distance(start,a)-distance(start,b));
  const unique=[];
  for(const p of targets){
    if(!unique.some(q=>distance(p,q)<1))unique.push(p);
  }

  const near=unique.slice(0,draft.stops);
  if(!near.length){
    say("Für dieses Lootziel sind auf dieser Karte keine Fundstellen hinterlegt.");
    return;
  }

  const end=exits.find(p=>p.id===draft.exit)||null;
  const ordered=bestOrder(start,near,end);
  const path=[
    {...start,title:"START · "+(start.title||"Eigene Position")},
    ...ordered.map(p=>({
      ...p,title:p.title+" · "+categoryName(p.category)
    }))
  ];

  if(end){
    path.push({...end,title:"AUSGANG · "+end.title+" · Bedingungen prüfen"});
  }

  draft.route=path.map(p=>({
    ...latLngToPosition(L.latLng(p.y,p.x)),
    name:text(p.title)
  }));

  editing=false;
  persist();
  routeList();
  drawRoute();
  bar.hidden=false;
  el("MapCount").textContent=ordered.length+" Lootstopps · Luftlinienroute";

  say("Route berechnet: "+ordered.length+" nahe Lootstopps."+
    (end?" Ausgangsbedingungen: "+
      (end.description||"Nicht hinterlegt – im Spiel prüfen."):"")+
    " Mit „Plan speichern“ sichern.");

  leafletMap.fitBounds(
    L.latLngBounds(path.map(p=>[p.y,p.x])),
    {padding:[35,55],animate:false}
  );
}

function addPoint(latlng,name){
  if(!editing||selected!==draft.map||loading||
    !bounds||!imageLayer||!bounds.contains(latlng))return;
  autoChoices();
  const start={x:latlng.lng,y:latlng.lat,title:"Eigene Startposition"};
  if(name){
    const spawn=spawns.find(p=>distance(p,start)<1);
    if(!spawn){
      el("MapCount").textContent="Bitte einen Spawnmarker antippen";
      return;
    }
    calculateRoute(spawn);
  }else calculateRoute(start);
}

const originalDraw=drawCommunity;

  originalDraw();
  communityLayer?.eachLayer(marker=>{
    if(typeof marker.getLatLng==="function"){
      marker.on("click",()=>addPoint(marker.getLatLng(),marker.options.title));
    }
  });
  drawRoute();
  autoChoices();
};

el("EditRoute").addEventListener("click",async()=>{
  if(!leafletMap){
    say("Die Karte ist noch nicht verfügbar.");
    return;
  }
  if(!lootCategories()){
    say("Wähle Safes looten, Schlüssel looten oder Waffenkisten looten.");
    return;
  }

  switchMap();
  for(let i=0;loading&&i<100;i++){
    await new Promise(resolve=>setTimeout(resolve,100));
  }

  if(loading||!currentData||!bounds||!imageLayer||state().image){
    say("Community-Karte noch nicht verfügbar. Bitte erneut versuchen.");
    return;
  }

  tool="inspect";
  keyMode=false;
  $("search").value="";
  const relevant=lootCategories();
  for(const c of currentData.categories){
    if(relevant.has(c.name)||/^player.*spawn/i.test(c.name)||
      c.name==="Extraction Point"){
      hidden.delete(c.name);
    }else hidden.add(c.name);
  }

  savePrefs();
  buildFilters();
  translate();
  editing=true;
  bar.hidden=false;
  routeList();
  el("MapCount").textContent=
    "Deinen Spawn antippen · Route wird automatisch berechnet";
  $("map").scrollIntoView({behavior:"smooth",block:"center"});
  drawCommunity();
});

    say("Importcode kopiert.");
  }catch(e){
    say("Kopieren nicht möglich. Den angezeigten Code gedrückt halten und kopieren.");
  }
});
el("LoadBuilds").addEventListener("click",()=>{
  if(frame)frame.remove();
  frame=document.createElement("iframe");
  frame.hidden=true;
  frame.title="Waffen-Buildliste";
  frame.src="./waffen.html";
  frame.addEventListener("load",()=>{
    frame.contentWindow.postMessage({
      type:"ABI_RAID_BUILDS_REQUEST"
    },location.origin);
  });
  document.body.append(frame);
  say("Buildliste wird geladen …");
  const requested=frame;
  setTimeout(()=>{
    if(frame===requested&&
      el("Status").textContent==="Buildliste wird geladen …"){
      say("Keine Antwort. Bitte den Verbindungsblock in waffen.html einfügen und erneut laden.");
    }
  },12000);
});

window.addEventListener("message",event=>{
  if(event.origin!==location.origin||!frame||
    event.source!==frame.contentWindow||
    event.data?.type!=="ABI_RAID_BUILDS")return;
  catalog=cleanBuilds(event.data.builds);
  persist();
  buildList();
  say(catalog.length+" Builds übernommen.");
});

fill();
drawCommunity();
})();
</script>

</body>
</html>
